<svg width="850" height="420" viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007ACC"/>
      <stop offset="100%" stop-color="#00C4CC"/>
    </linearGradient>

    <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C4CC" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00C4CC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="420" rx="18" fill="#0D1117"/>

  <!-- Title -->
  <text x="425" y="45"
        text-anchor="middle"
        fill="#F0F6FC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="700">
    Academic Performance
  </text>

  <text x="425" y="70"
        text-anchor="middle"
        fill="#8B949E"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13">
    Semester GPA Progress
  </text>

  <!-- Chart area -->
  <line x1="90" y1="105" x2="90" y2="330"
        stroke="#30363D" stroke-width="2"/>

  <line x1="90" y1="330" x2="780" y2="330"
        stroke="#30363D" stroke-width="2"/>

  <!-- Horizontal grid -->
  <line x1="90" y1="330" x2="780" y2="330"
        stroke="#30363D" stroke-dasharray="5 8"/>

  <line x1="90" y1="274" x2="780" y2="274"
        stroke="#30363D" stroke-dasharray="5 8"/>

  <line x1="90" y1="218" x2="780" y2="218"
        stroke="#30363D" stroke-dasharray="5 8"/>

  <line x1="90" y1="162" x2="780" y2="162"
        stroke="#30363D" stroke-dasharray="5 8"/>

  <line x1="90" y1="106" x2="780" y2="106"
        stroke="#30363D" stroke-dasharray="5 8"/>

  <!-- Y-axis labels -->
  <text x="70" y="335"
        text-anchor="end"
        fill="#8B949E"
        font-family="Arial"
        font-size="12">3.0</text>

  <text x="70" y="279"
        text-anchor="end"
        fill="#8B949E"
        font-family="Arial"
        font-size="12">3.25</text>

  <text x="70" y="223"
        text-anchor="end"
        fill="#8B949E"
        font-family="Arial"
        font-size="12">3.5</text>

  <text x="70" y="167"
        text-anchor="end"
        fill="#8B949E"
        font-family="Arial"
        font-size="12">3.75</text>

  <text x="70" y="111"
        text-anchor="end"
        fill="#8B949E"
        font-family="Arial"
        font-size="12">4.0</text>

  <!-- Cumulative GPA line -->
  <line x1="90" y1="137"
        x2="780" y2="137"
        stroke="#F2C811"
        stroke-width="2"
        stroke-dasharray="8 8"
        opacity="0.8"/>

  <text x="780" y="128"
        text-anchor="end"
        fill="#F2C811"
        font-family="Arial"
        font-size="12"
        font-weight="700">
    Cumulative GPA: 3.86
  </text>

  <!-- Area under line -->
  <path d="
    M 130 170
    L 340 117
    L 550 146
    L 760 106
    L 760 330
    L 130 330
    Z"
    fill="url(#areaGradient)"
  />

  <!-- GPA line -->
  <polyline
    points="130,170 340,117 550,146 760,106"
    fill="none"
    stroke="url(#lineGradient)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Semester 1 -->
  <circle cx="130" cy="170" r="8"
          fill="#0D1117"
          stroke="#007ACC"
          stroke-width="4">
    <title>Semester 1 — GPA: 3.72</title>
  </circle>

  <text x="130" y="365"
        text-anchor="middle"
        fill="#8B949E"
        font-family="Arial"
        font-size="13">
    Semester 1
  </text>

  <!-- Semester 2 -->
  <circle cx="340" cy="117" r="8"
          fill="#0D1117"
          stroke="#00ADD8"
          stroke-width="4">
    <title>Semester 2 — GPA: 3.95</title>
  </circle>

  <text x="340" y="365"
        text-anchor="middle"
        fill="#8B949E"
        font-family="Arial"
        font-size="13">
    Semester 2
  </text>

  <!-- Semester 3 -->
  <circle cx="550" cy="146" r="8"
          fill="#0D1117"
          stroke="#00ADD8"
          stroke-width="4">
    <title>Semester 3 — GPA: 3.82</title>
  </circle>

  <text x="550" y="365"
        text-anchor="middle"
        fill="#8B949E"
        font-family="Arial"
        font-size="13">
    Semester 3
  </text>

  <!-- Semester 4 -->
  <circle cx="760" cy="106" r="11"
          fill="#6DB33F"
          stroke="#FFFFFF"
          stroke-width="4">
    <title>Semester 4 — GPA: 4.00</title>
  </circle>

  <text x="760" y="365"
        text-anchor="middle"
        fill="#6DB33F"
        font-family="Arial"
        font-size="13"
        font-weight="700">
    Semester 4
  </text>

  <!-- Latest GPA label -->
  <text x="760" y="88"
        text-anchor="middle"
        fill="#6DB33F"
        font-family="Arial"
        font-size="15"
        font-weight="700">
    4.00 🎓
  </text>

</svg>
