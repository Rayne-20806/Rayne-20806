<svg width="850" height="420" viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007ACC"/>
      <stop offset="100%" stop-color="#00C4CC"/>
    </linearGradient>

    <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C4CC" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00C4CC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="420" rx="18" fill="#0D1117"/>

  <!-- Title -->
  <text x="425" y="42"
        text-anchor="middle"
        fill="#F0F6FC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="700">
    Academic Performance
  </text>

  <text x="425" y="66"
        text-anchor="middle"
        fill="#8B949E"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13">
    Semester GPA Progress
  </text>

  <!-- Chart -->
  <line x1="90" y1="105" x2="90" y2="320"
        stroke="#30363D" stroke-width="2"/>

  <line x1="90" y1="320" x2="780" y2="320"
        stroke="#30363D" stroke-width="2"/>

  <!-- Grid -->
  <line x1="90" y1="320" x2="780" y2="320"
        stroke="#30363D" stroke-dasharray="5 8"/>

  <line x1="90" y1="266" x2="780" y2="266"
        stroke="#30363D" stroke-dasharray="5 8"/>

  <line x1="90" y1="212" x2="780" y2="212"
        stroke="#30363D" stroke-dasharray="5 8"/>

  <line x1="90" y1="158" x2="780" y2="158"
        stroke="#30363D" stroke-dasharray="5 8"/>

  <line x1="90" y1="104" x2="780" y2="104"
        stroke="#30363D" stroke-dasharray="5 8"/>

  <!-- Y Axis -->
  <text x="70" y="325"
        text-anchor="end"
        fill="#8B949E"
        font-family="Arial"
        font-size="12">3.0</text>

  <text x="70" y="271"
        text-anchor="end"
        fill="#8B949E"
        font-family="Arial"
        font-size="12">3.25</text>

  <text x="70" y="217"
        text-anchor="end"
        fill="#8B949E"
        font-family="Arial"
        font-size="12">3.50</text>

  <text x="70" y="163"
        text-anchor="end"
        fill="#8B949E"
        font-family="Arial"
        font-size="12">3.75</text>

  <text x="70" y="109"
        text-anchor="end"
        fill="#8B949E"
        font-family="Arial"
        font-size="12">4.00</text>

  <!-- Cumulative GPA Line -->
  <line x1="90" y1="132"
        x2="780" y2="132"
        stroke="#F2C811"
        stroke-width="2"
        stroke-dasharray="8 8"
        opacity="0.9"/>

  <text x="780" y="124"
        text-anchor="end"
        fill="#F2C811"
        font-family="Arial"
        font-size="12"
        font-weight="700">
    Cumulative GPA: 3.87
  </text>

  <!-- Area -->
  <path d="
    M 130 165
    L 340 115
    L 550 143
    L 760 104
    L 760 320
    L 130 320
    Z"
    fill="url(#areaGradient)"
  />

  <!-- GPA Line -->
  <polyline
    points="130,165 340,115 550,143 760,104"
    fill="none"
    stroke="url(#lineGradient)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Semester 1 -->
  <circle cx="130" cy="165" r="8"
          fill="#0D1117"
          stroke="#007ACC"
          stroke-width="4">
    <title>Semester 1 — GPA: 3.72</title>
  </circle>

  <text x="130" y="143"
        text-anchor="middle"
        fill="#F0F6FC"
        font-family="Arial"
        font-size="15"
        font-weight="700">
    3.72
  </text>

  <text x="130" y="350"
        text-anchor="middle"
        fill="#8B949E"
        font-family="Arial"
        font-size="13">
    Semester 1
  </text>

  <!-- Semester 2 -->
  <circle cx="340" cy="115" r="8"
          fill="#0D1117"
          stroke="#00ADD8"
          stroke-width="4">
    <title>Semester 2 — GPA: 3.95</title>
  </circle>

  <text x="340" y="93"
        text-anchor="middle"
        fill="#F0F6FC"
        font-family="Arial"
        font-size="15"
        font-weight="700">
    3.95
  </text>

  <text x="340" y="350"
        text-anchor="middle"
        fill="#8B949E"
        font-family="Arial"
        font-size="13">
    Semester 2
  </text>

  <!-- Semester 3 -->
  <circle cx="550" cy="143" r="8"
          fill="#0D1117"
          stroke="#00ADD8"
          stroke-width="4">
    <title>Semester 3 — GPA: 3.82</title>
  </circle>

  <text x="550" y="121"
        text-anchor="middle"
        fill="#F0F6FC"
        font-family="Arial"
        font-size="15"
        font-weight="700">
    3.82
  </text>

  <text x="550" y="350"
        text-anchor="middle"
        fill="#8B949E"
        font-family="Arial"
        font-size="13">
    Semester 3
  </text>

  <!-- Semester 4 -->
  <circle cx="760" cy="104" r="11"
          fill="#6DB33F"
          stroke="#FFFFFF"
          stroke-width="4">
    <title>Semester 4 — GPA: 4.00</title>
  </circle>

  <text x="760" y="81"
        text-anchor="middle"
        fill="#6DB33F"
        font-family="Arial"
        font-size="17"
        font-weight="700">
    4.00
  </text>

  <text x="760" y="350"
        text-anchor="middle"
        fill="#6DB33F"
        font-family="Arial"
        font-size="13"
        font-weight="700">
    Semester 4
  </text>

  <!-- Bottom Summary -->
  <text x="425" y="390"
        text-anchor="middle"
        fill="#8B949E"
        font-family="Arial"
        font-size="13">
    Cumulative GPA: 3.87
  </text>

</svg>
